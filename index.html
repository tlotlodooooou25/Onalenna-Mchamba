<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hey You Gorgeous! 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* BACKGROUND PHOTO */
        .background {
            position: fixed;
            inset: 0;

            background-image: url("IMG-20250919-WA0037.jpg");
            background-size: cover;
            background-position: center;

            z-index: -2;
        }

        /* DARK OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.38);

            z-index: -1;
        }

        /* MAIN CONTENT */
        .content {
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;

            color: white;

            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            margin-bottom: 20px;

            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .question {
            font-size: clamp(1.1rem, 3vw, 1.7rem);
            margin-bottom: 40px;

            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
        }

        /* AGE BUTTONS */
        .tabs {
            display: flex;
            gap: 25px;
        }

        .age-button {
            width: 120px;
            height: 65px;

            border: 2px solid white;
            border-radius: 35px;

            background: rgba(255, 255, 255, 0.18);

            color: white;

            font-size: 1.5rem;
            font-weight: bold;

            cursor: pointer;

            backdrop-filter: blur(8px);

            transition: all 0.3s ease;
        }

        .age-button:hover {
            transform: translateY(-6px) scale(1.05);

            background: rgba(255, 255, 255, 0.35);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .age-button:active {
            transform: scale(0.95);
        }

        /* ERROR POPUP */
        .error-message {
            position: fixed;
            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.65);

            z-index: 10;
        }

        .error-box {
            width: min(90%, 400px);

            padding: 40px 30px;

            text-align: center;

            background: white;

            border-radius: 25px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

            animation: errorShake 0.4s ease;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .error-box h2 {
            color: #d62828;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .error-box p {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .error-box button {
            border: none;

            padding: 12px 25px;

            border-radius: 25px;

            background: #222;

            color: white;

            cursor: pointer;

            font-size: 1rem;
        }

        /* CELEBRATION */
        #celebration {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 20;

            overflow: hidden;
        }

        .balloon {
            position: absolute;

            bottom: -150px;

            width: 60px;
            height: 75px;

            border-radius: 50%;

            animation: floatUp linear forwards;
        }

        .balloon::after {
            content: "";

            position: absolute;

            width: 2px;
            height: 100px;

            background: white;

            top: 70px;
            left: 50%;
        }

        .confetti {
            position: absolute;

            width: 10px;
            height: 18px;

            top: -30px;

            animation: fall linear forwards;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes errorShake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-120vh) rotate(25deg);
                opacity: 0;
            }
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
            }

            to {
                transform: translateY(120vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <main class="content">

        <h1>Hey you gorgeous! 💕</h1>

        <p class="question">
            Today we are confirming something: 😌
        </p>

        <div class="tabs">

            <button class="age-button" onclick="wrongAge()">
                19
            </button>

            <button class="age-button" onclick="correctAge()">
                20
            </button>

        </div>

    </main>


    <!-- ERROR MESSAGE -->

    <div id="errorMessage" class="error-message">

        <div class="error-box">

            <div class="error-icon">❌</div>

            <h2>ERROR</h2>

            <p>Incorrect age detected.</p>

            <button onclick="closeError()">
                Try Again
            </button>

        </div>

    </div>


    <!-- CELEBRATION -->

    <div id="celebration"></div>


    <script>

        function wrongAge() {

            const error =
                document.getElementById("errorMessage");

            error.style.display = "flex";
        }


        function closeError() {

            const error =
                document.getElementById("errorMessage");

            error.style.display = "none";
        }


        function correctAge() {

            const celebration =
                document.getElementById("celebration");


            /* BALLOONS */

            for (let i = 0; i < 18; i++) {

                const balloon =
                    document.createElement("div");

                balloon.classList.add("balloon");

                balloon.style.left =
                    Math.random() * 100 + "%";

                balloon.style.animationDuration =
                    (4 + Math.random() * 4) + "s";

                balloon.style.background =
                    `hsl(${Math.random() * 360}, 80%, 65%)`;

                celebration.appendChild(balloon);
            }


            /* CONFETTI */

            for (let i = 0; i < 120; i++) {

                const confetti =
                    document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    Math.random() * 100 + "%";

                confetti.style.background =
                    `hsl(${Math.random() * 360}, 80%, 60%)`;

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                celebration.appendChild(confetti);
            }


            /* PAGE 2 */

            setTimeout(() => {

                window.location.href = "page2.html";

            }, 5000);

        }

    </script>

</body>
</html>
